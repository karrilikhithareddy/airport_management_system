<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Passenger - Airport Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf4ff, #f8fbff);
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .form-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    {% include 'navbar.html' %}

    <div class="container">

        <div class="form-box">

            <h1>👤 Add New Passenger</h1>

            <p class="subtitle">
                Enter the passenger details below
            </p>

            <form action="/add-passenger" method="POST">

                <div class="form-group">
                    <label>Passenger Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter passenger name"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Age</label>

                        <input
                            type="number"
                            name="age"
                            placeholder="Enter age"
                            min="1"
                            max="120"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Gender</label>

                        <select name="gender" required>

                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>

                        </select>
                    </div>

                </div>

                <div class="form-group">
                    <label>Phone Number</label>

                    <input
                        type="tel"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Flight Number</label>

                        <input
                            type="text"
                            name="flight_number"
                            placeholder="Example: AI202"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Seat Number</label>

                        <input
                            type="text"
                            name="seat_number"
                            placeholder="Example: 12A"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="submit-btn">
                    👤 Add Passenger
                </button>

            </form>

            <a href="/passengers" class="back-link">
                ← Back to Passengers
            </a>

        </div>

    </div>

</body>
</html>
